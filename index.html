<title>Wall Clock</title>
<!--
  Video-wall clock for Barco CTRL web sources.
  Time = South African Standard Time (UTC+2, no daylight saving) computed from
  UTC, so the decoder/gateway's own time-zone setting does not matter; only its
  clock must be NTP-synced.
  URL options:  ?tz=2       hours from UTC (default 2)
                ?logo=0     hide the logo
                ?bg=000000  background colour (hex, no #)
-->
<style>
  :root { --bg: #000; --fg: #fff; --accent: #c8102e; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; cursor: none; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3vmin; color: var(--fg);
    font-family: "Segoe UI", "Helvetica Neue", Arial, "Liberation Sans", sans-serif;
  }
  #logo { width: min(60vw, 100vh); height: auto; display: block; }
  #clock {
    font-size: min(20vw, 28vh); font-weight: 600; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: 0.02em; white-space: nowrap;
  }
  #clock .sep { color: var(--accent); }
  #date { font-size: min(4.6vw, 6.5vh); font-weight: 500; letter-spacing: 0.04em; white-space: nowrap; opacity: 0.9; }
  body.nologo #clock { font-size: min(24vw, 46vh); }
  body.nologo #date { font-size: min(6vw, 10vh); }
</style>

<div id="date"></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var tz = parseFloat(q.get('tz'));
  if (isNaN(tz) || tz < -14 || tz > 14) tz = 2;
  if (q.get('logo') === '0') {
    document.getElementById('logo').remove();
    document.body.classList.add('nologo');
  }
  var bg = q.get('bg');
  if (bg && /^[0-9a-fA-F]{6}$/.test(bg)) document.documentElement.style.setProperty('--bg', '#' + bg);

  var hh = document.getElementById('hh'), mm = document.getElementById('mm'), ss = document.getElementById('ss');
  var dt = document.getElementById('date');
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
                'August', 'September', 'October', 'November', 'December'];
  function two(n) { return n < 10 ? '0' + n : '' + n; }
  function tick() {
    var d = new Date(Date.now() + tz * 3600000);
    hh.textContent = two(d.getUTCHours());
    mm.textContent = two(d.getUTCMinutes());
    ss.textContent = two(d.getUTCSeconds());
    var ds = DAYS[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
    if (dt.textContent !== ds) dt.textContent = ds;
    // wake just after the next whole second so the seconds never skip or lag
    setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
  }
  tick();
})();
